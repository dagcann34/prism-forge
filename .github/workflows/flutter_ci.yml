name: PRISM FORGE CI — Analyze, Test, Android APK & iOS Simulator

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Optional release versionName (e.g. 1.0.1)'
        required: false
        default: ''
      build_number:
        description: 'Optional release versionCode (e.g. 2)'
        required: false
        default: ''

jobs:
  analyze_and_test:
    name: Analyze & Test (Flutter + Pure Dart Engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify pure Dart rules engine & all 24 stages
        run: dart run tool/verify_engine.dart
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Static analysis
        run: |
          if ! OUT=$(flutter analyze 2>&1); then
            echo "$OUT"
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$OUT"
            exit 1
          fi
          echo "$OUT"
      - name: Run unit & widget tests
        run: flutter test

  build_android:
    name: Build Android APK & Play Store AAB
    runs-on: ubuntu-latest
    needs: analyze_and_test
    env:
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      ADMOB_ANDROID_BANNER_ID: ${{ secrets.ADMOB_ANDROID_BANNER_ID }}
      ADMOB_ANDROID_INTERSTITIAL_ID: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
      ADMOB_ANDROID_REWARDED_ID: ${{ secrets.ADMOB_ANDROID_REWARDED_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Decode Play Store upload keystore (if configured in Secrets)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
            echo "Play Store release signing enabled."
          else
            echo "No upload keystore secrets configured — building with debug signing for verification."
          fi
      - run: flutter pub get
      - name: Build Android Release APK & AAB (with AdMob Secrets or Test IDs)
        run: |
          FLAGS=()
          if [ -n "${{ inputs.build_name }}" ]; then FLAGS+=("--build-name=${{ inputs.build_name }}"); fi
          if [ -n "${{ inputs.build_number }}" ]; then FLAGS+=("--build-number=${{ inputs.build_number }}"); fi
          if [ -n "$ADMOB_ANDROID_BANNER_ID" ]; then FLAGS+=("--dart-define=ADMOB_ANDROID_BANNER_ID=$ADMOB_ANDROID_BANNER_ID"); fi
          if [ -n "$ADMOB_ANDROID_INTERSTITIAL_ID" ]; then FLAGS+=("--dart-define=ADMOB_ANDROID_INTERSTITIAL_ID=$ADMOB_ANDROID_INTERSTITIAL_ID"); fi
          if [ -n "$ADMOB_ANDROID_REWARDED_ID" ]; then FLAGS+=("--dart-define=ADMOB_ANDROID_REWARDED_ID=$ADMOB_ANDROID_REWARDED_ID"); fi
          if ! OUT=$(flutter build apk --release ${FLAGS[@]+"${FLAGS[@]}"} 2>&1); then
            echo "$OUT"
            printf '%s\n' "$OUT" | tr '\r' '\n' | grep -v 'Unzipping' | grep -iE 'error|exception|failed|failure|what went wrong|could not|fatal|requires|unable|incompatible|conflict' | tail -n 8 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "$OUT"
          if ! OUT=$(flutter build appbundle --release ${FLAGS[@]+"${FLAGS[@]}"} 2>&1); then
            echo "$OUT"
            printf '%s\n' "$OUT" | tr '\r' '\n' | grep -v 'Unzipping' | grep -iE 'error|exception|failed|failure|what went wrong|could not|fatal|requires|unable|incompatible|conflict' | tail -n 8 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: prism-forge-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: prism-forge-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  verify_ios:
    name: Verify iOS Simulator Build (macOS / Xcode)
    runs-on: macos-latest
    needs: analyze_and_test
    env:
      ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
      ADMOB_IOS_BANNER_ID: ${{ secrets.ADMOB_IOS_BANNER_ID }}
      ADMOB_IOS_INTERSTITIAL_ID: ${{ secrets.ADMOB_IOS_INTERSTITIAL_ID }}
      ADMOB_IOS_REWARDED_ID: ${{ secrets.ADMOB_IOS_REWARDED_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: Configure iOS AdMob App ID & Build iOS Simulator
        run: |
          if [ -n "$ADMOB_IOS_APP_ID" ]; then
            echo "ADMOB_IOS_APP_ID = $ADMOB_IOS_APP_ID" > ios/Flutter/AdMob.xcconfig
          fi
          DEFINES=()
          if [ -n "$ADMOB_IOS_BANNER_ID" ]; then DEFINES+=("--dart-define=ADMOB_IOS_BANNER_ID=$ADMOB_IOS_BANNER_ID"); fi
          if [ -n "$ADMOB_IOS_INTERSTITIAL_ID" ]; then DEFINES+=("--dart-define=ADMOB_IOS_INTERSTITIAL_ID=$ADMOB_IOS_INTERSTITIAL_ID"); fi
          if [ -n "$ADMOB_IOS_REWARDED_ID" ]; then DEFINES+=("--dart-define=ADMOB_IOS_REWARDED_ID=$ADMOB_IOS_REWARDED_ID"); fi
          if ! OUT=$(flutter build ios --simulator --no-codesign ${DEFINES[@]+"${DEFINES[@]}"} 2>&1); then
            echo "$OUT"
            printf '%s\n' "$OUT" | tr '\r' '\n' | grep -iE 'error|unable to find|failed|fatal|pod install|xcodebuild|incompatible|missing' | tail -n 8 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "$OUT"
