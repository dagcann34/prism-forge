name: PRISM FORGE CI — Analyze, Test, Android APK & iOS Simulator

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  analyze_and_test:
    name: Analyze & Test (Flutter + Pure Dart Engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify pure Dart rules engine & all 24 stages
        run: dart run tool/verify_engine.dart
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Static analysis
        run: |
          if ! OUT=$(flutter analyze 2>&1); then
            echo "$OUT"
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$OUT"
            exit 1
          fi
          echo "$OUT"
      - name: Run unit & widget tests
        run: flutter test

  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: prism-forge-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  verify_ios:
    name: Verify iOS Simulator Build (macOS / Xcode)
    runs-on: macos-latest
    needs: analyze_and_test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign
