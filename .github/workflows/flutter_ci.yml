name: PRISM FORGE CI — Analyze, Test, Android APK & iOS Simulator

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  analyze_and_test:
    name: Analyze & Test (Flutter + Pure Dart Engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify pure Dart rules engine & all 24 stages
        run: dart run tool/verify_engine.dart
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Static analysis
        run: |
          if ! OUT=$(flutter analyze 2>&1); then
            echo "$OUT"
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$OUT"
            exit 1
          fi
          echo "$OUT"
      - name: Run unit & widget tests
        run: flutter test

  build_android:
    name: Build Android APK & Play Store AAB
    runs-on: ubuntu-latest
    needs: analyze_and_test
    env:
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      ADMOB_ANDROID_BANNER_ID: ${{ secrets.ADMOB_ANDROID_BANNER_ID }}
      ADMOB_ANDROID_INTERSTITIAL_ID: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
      ADMOB_ANDROID_REWARDED_ID: ${{ secrets.ADMOB_ANDROID_REWARDED_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android Release APK & AAB (with AdMob Secrets or Test IDs)
        run: |
          DEFINES=()
          if [ -n "$ADMOB_ANDROID_BANNER_ID" ]; then DEFINES+=("--dart-define=ADMOB_ANDROID_BANNER_ID=$ADMOB_ANDROID_BANNER_ID"); fi
          if [ -n "$ADMOB_ANDROID_INTERSTITIAL_ID" ]; then DEFINES+=("--dart-define=ADMOB_ANDROID_INTERSTITIAL_ID=$ADMOB_ANDROID_INTERSTITIAL_ID"); fi
          if [ -n "$ADMOB_ANDROID_REWARDED_ID" ]; then DEFINES+=("--dart-define=ADMOB_ANDROID_REWARDED_ID=$ADMOB_ANDROID_REWARDED_ID"); fi
          if ! OUT=$(flutter build apk --release ${DEFINES[@]+"${DEFINES[@]}"} 2>&1); then
            echo "$OUT"
            echo "$OUT" | tail -n 35 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "$OUT"
          if ! OUT=$(flutter build appbundle --release ${DEFINES[@]+"${DEFINES[@]}"} 2>&1); then
            echo "$OUT"
            echo "$OUT" | tail -n 35 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: prism-forge-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: prism-forge-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  verify_ios:
    name: Verify iOS Simulator Build (macOS / Xcode)
    runs-on: macos-latest
    needs: analyze_and_test
    env:
      ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
      ADMOB_IOS_BANNER_ID: ${{ secrets.ADMOB_IOS_BANNER_ID }}
      ADMOB_IOS_INTERSTITIAL_ID: ${{ secrets.ADMOB_IOS_INTERSTITIAL_ID }}
      ADMOB_IOS_REWARDED_ID: ${{ secrets.ADMOB_IOS_REWARDED_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure iOS AdMob App ID & Build iOS Simulator
        run: |
          if [ -n "$ADMOB_IOS_APP_ID" ]; then
            echo "ADMOB_IOS_APP_ID = $ADMOB_IOS_APP_ID" > ios/Flutter/AdMob.xcconfig
          fi
          DEFINES=()
          if [ -n "$ADMOB_IOS_BANNER_ID" ]; then DEFINES+=("--dart-define=ADMOB_IOS_BANNER_ID=$ADMOB_IOS_BANNER_ID"); fi
          if [ -n "$ADMOB_IOS_INTERSTITIAL_ID" ]; then DEFINES+=("--dart-define=ADMOB_IOS_INTERSTITIAL_ID=$ADMOB_IOS_INTERSTITIAL_ID"); fi
          if [ -n "$ADMOB_IOS_REWARDED_ID" ]; then DEFINES+=("--dart-define=ADMOB_IOS_REWARDED_ID=$ADMOB_IOS_REWARDED_ID"); fi
          if ! OUT=$(flutter build ios --simulator --no-codesign ${DEFINES[@]+"${DEFINES[@]}"} 2>&1); then
            echo "$OUT"
            echo "$OUT" | tail -n 35 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "$OUT"
